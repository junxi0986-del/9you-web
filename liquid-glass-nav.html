<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>液态玻璃椭圆导航栏</title>
<style>
  /* ================= 主题变量（所有颜色集中于此，方便切换主题） ================= */
  :root {
    --page-bg: #f2f2f7;                       /* 页面背景 */
    --text-color: #1c1c1e;
    --bar-bg: rgba(255,255,255,0.6);          /* 导航容器背景 */
    --bar-border: rgba(255,255,255,0.5);
    --bar-shadow: 0 4px 24px rgba(0,0,0,0.08);
    --glass-bg: rgba(255,255,255,0.75);       /* 高亮块背景 */
    --glass-border: rgba(255,255,255,0.9);
    --glass-inset: rgba(255,255,255,0.9);     /* 顶部内高光线 */
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.12); /* 亮色：柔和阴影 */
    --icon-color: #8e8e93;
    --icon-active: #007aff;
  }
  /* 手动切换：暗色（覆盖系统设置） */
  :root[data-theme="dark"] {
    --page-bg: #000;
    --text-color: #f5f5f7;
    --bar-bg: rgba(255,255,255,0.08);
    --bar-border: rgba(255,255,255,0.12);
    --bar-shadow: 0 4px 24px rgba(0,0,0,0.4);
    --glass-bg: rgba(255,255,255,0.12);
    --glass-border: rgba(255,255,255,0.18);
    --glass-inset: rgba(255,255,255,0.25);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.5);  /* 暗色：深阴影 */
    --icon-color: #8e8e93;
    --icon-active: #0a84ff;
  }
  /* 跟随系统：暗色（未被手动设为 light 时生效） */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #000;
      --text-color: #f5f5f7;
      --bar-bg: rgba(255,255,255,0.08);
      --bar-border: rgba(255,255,255,0.12);
      --bar-shadow: 0 4px 24px rgba(0,0,0,0.4);
      --glass-bg: rgba(255,255,255,0.12);
      --glass-border: rgba(255,255,255,0.18);
      --glass-inset: rgba(255,255,255,0.25);
      --glass-shadow: 0 8px 32px rgba(0,0,0,0.5);
      --icon-color: #8e8e93;
      --icon-active: #0a84ff;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    min-height: 100dvh;
    background: var(--page-bg);
    color: var(--text-color);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    /* 主题切换 0.3s 平滑过渡 */
    transition: background-color .3s ease, color .3s ease;
    display: flex; flex-direction: column; align-items: center;
    padding: 60px 20px calc(140px + env(safe-area-inset-bottom));
    overflow-x: hidden;
  }

  /* 装饰性渐变色块：让玻璃模糊效果可见 */
  .blob { position: fixed; border-radius: 50%; filter: blur(60px); opacity: .55; pointer-events: none; z-index: 0; }
  .blob-1 { width: 260px; height: 260px; background: #ffb199; left: -60px; top: 30%; }
  .blob-2 { width: 300px; height: 300px; background: #6ee7f5; right: -80px; top: 45%; }
  .blob-3 { width: 220px; height: 220px; background: #c4b5fd; left: 30%; bottom: -40px; }

  h1 { font-size: 20px; z-index: 1; }
  .tip { font-size: 13px; opacity: .6; margin-top: 8px; z-index: 1; }

  .demo-list { width: 100%; max-width: 420px; margin-top: 24px; display: flex; flex-direction: column; gap: 12px; z-index: 1; }
  .demo-card {
    height: 84px; border-radius: 16px;
    background: var(--bar-bg); border: 1px solid var(--bar-border);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex; align-items: center; padding: 0 18px; font-size: 14px; opacity: .9;
  }

  /* ================= 右上角主题切换按钮 ================= */
  .theme-toggle {
    position: fixed; top: calc(14px + env(safe-area-inset-top)); right: 16px; z-index: 10;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--bar-border);
    background: var(--bar-bg);
    backdrop-filter: blur(18px) saturate(1.6); -webkit-backdrop-filter: blur(18px) saturate(1.6);
    box-shadow: var(--bar-shadow);
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background-color .3s ease, border-color .3s ease, box-shadow .3s ease, transform .15s ease;
  }
  .theme-toggle:active { transform: scale(.92); }

  /* ================= 底部椭圆导航容器 ================= */
  .pill-nav {
    position: fixed;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom));   /* 底部安全区 */
    transform: translateX(-50%);
    z-index: 5;
    width: min(340px, calc(100vw - 40px));
    height: 64px;
    display: flex;                                       /* 4 个图标等宽分布 */
    align-items: stretch;
    background: var(--bar-bg);
    border: 1px solid var(--bar-border);
    border-radius: 999px;                                /* 扁椭圆 pill */
    box-shadow: var(--bar-shadow);
    backdrop-filter: blur(18px) saturate(1.6);
    -webkit-backdrop-filter: blur(18px) saturate(1.6);
    transition: background-color .3s ease, border-color .3s ease, box-shadow .3s ease;
  }

  /* 选中项高亮块：独立椭圆，上移错位悬浮于容器之上 */
  .pill-nav__highlight {
    position: absolute;
    top: -7px;                                           /* 略微上移错位 */
    left: 0;
    width: 25%;
    height: calc(100% + 10px);
    z-index: 1;
    pointer-events: none;
    will-change: transform;
    /* 弹性丝滑滑动 */
    transition: transform .4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  /* 液态玻璃质感 */
  .pill-nav__glass {
    position: absolute;
    inset: 3px 4px;                                      /* 留出边距，露出与容器的分层 */
    border-radius: 999px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 var(--glass-inset), var(--glass-shadow);
    backdrop-filter: blur(18px) saturate(1.6);
    -webkit-backdrop-filter: blur(18px) saturate(1.6);
    transition: background-color .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  /* 滑动时轻微挤压回弹：0.96 → 1 */
  .pill-nav__glass.squeeze { animation: squeeze .4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes squeeze { from { transform: scale(0.96); } to { transform: scale(1); } }

  /* 导航图标按钮 */
  .pill-nav__btn {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer;
    color: var(--icon-color);
    transition: color .3s ease, transform .3s ease;      /* 图标颜色 / 缩放过渡 */
  }
  .pill-nav__btn svg { width: 24px; height: 24px; }
  .pill-nav__btn.is-active { color: var(--icon-active); transform: scale(1.1); }  /* 选中放大 */
  .pill-nav__btn:active { transform: scale(.9); }
</style>
</head>
<body>

  <!-- 右上角主题切换 -->
  <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>

  <!-- 装饰色块（衬托玻璃模糊） -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <h1>液态玻璃椭圆导航栏</h1>
  <div class="tip">点击图标切换 · 滑动时有挤压回弹 · 右上角切换深浅主题</div>

  <!-- 演示内容：可滚动，滑到导航栏下方可见玻璃模糊效果 -->
  <div class="demo-list" id="demoList"></div>

  <!-- 底部椭圆导航栏 -->
  <nav class="pill-nav" id="pillNav" aria-label="主导航">
    <!-- 独立高亮块（液态玻璃） -->
    <span class="pill-nav__highlight" id="navHighlight"><span class="pill-nav__glass" id="navGlass"></span></span>

    <button class="pill-nav__btn is-active" aria-label="首页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>
      </svg>
    </button>
    <button class="pill-nav__btn" aria-label="发现">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4.5 4.5"/>
      </svg>
    </button>
    <button class="pill-nav__btn" aria-label="消息">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
      </svg>
    </button>
    <button class="pill-nav__btn" aria-label="我的">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
      </svg>
    </button>
  </nav>

<script>
/* ================= 导航高亮块滑动 ================= */
(function () {
  const nav = document.getElementById('pillNav');
  const hl = document.getElementById('navHighlight');
  const glass = document.getElementById('navGlass');
  const btns = [...nav.querySelectorAll('.pill-nav__btn')];
  let active = 0;

  // 把高亮块平移到当前激活按钮的中心（offsetParent 为 fixed 导航容器）
  function moveHighlight(animate) {
    const btn = btns[active];
    const x = btn.offsetLeft + btn.offsetWidth / 2 - hl.offsetWidth / 2;
    if (!animate) {  // 初始化 / 窗口尺寸变化：不动画直接就位
      hl.style.transition = 'none';
      hl.style.transform = `translateX(${x}px)`;
      void hl.offsetWidth;           // 强制回流后恢复过渡
      hl.style.transition = '';
      return;
    }
    hl.style.transform = `translateX(${x}px)`;
    glass.classList.remove('squeeze');  // 重启挤压回弹动画
    void glass.offsetWidth;
    glass.classList.add('squeeze');
  }

  btns.forEach((btn, i) => btn.addEventListener('click', () => {
    if (i === active) return;
    btns[active].classList.remove('is-active');
    btn.classList.add('is-active');
    active = i;
    moveHighlight(true);
  }));

  window.addEventListener('resize', () => moveHighlight(false));
  moveHighlight(false);
})();

/* ================= 主题切换（手动覆盖系统，localStorage 记住选择） ================= */
(function () {
  const root = document.documentElement;
  const toggle = document.getElementById('themeToggle');
  const prefersDark = () => window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = () => root.dataset.theme === 'dark' || (!root.dataset.theme && prefersDark());

  function refreshIcon() { toggle.textContent = isDark() ? '☀️' : '🌙'; }

  toggle.addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    root.dataset.theme = next;                       // 写在 <html> 上覆盖系统设置
    localStorage.setItem('pillNavTheme', next);      // 记住选择
    refreshIcon();
  });

  const saved = localStorage.getItem('pillNavTheme');
  if (saved === 'dark' || saved === 'light') root.dataset.theme = saved;
  refreshIcon();
})();

/* ================= 演示占位卡片 ================= */
(function () {
  const list = document.getElementById('demoList');
  list.innerHTML = Array.from({ length: 10 }, (_, i) => `<div class="demo-card">演示内容 ${i + 1} · 下滑时导航栏下可看到玻璃模糊</div>`).join('');
})();
</script>
</body>
</html>
